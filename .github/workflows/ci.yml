# Pipeline de calidad: corre en cada pull request y en cada push a main.
# Si algún paso falla, el pull request no se puede fusionar (protección de rama).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validar:
    name: Validación de código y rúbrica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: HTML (html-validate)
        run: npm run lint:html
      - name: CSS (stylelint)
        run: npm run lint:css
      - name: JavaScript (eslint)
        run: npm run lint:js
      - name: Requisitos de la rúbrica
        run: npm run check:rubrica
      - name: Mínimos de contenido (aviso hasta completar el sitio)
        run: npm run check:rubrica:final
        continue-on-error: true
      - name: Pruebas unitarias
        run: npm test

  w3c:
    name: Validador oficial W3C (Nu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Descargar validador Nu
        run: curl -sSL -o vnu.jar https://github.com/validator/validator/releases/download/latest/vnu.jar
      - name: Validar HTML y CSS
        run: java -jar vnu.jar --also-check-css *.html css/style.css

  lighthouse:
    name: Lighthouse (accesibilidad, buenas prácticas, SEO)
    runs-on: ubuntu-latest
    needs: validar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @lhci/cli@0.14.0 autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-lighthouse
          path: .lighthouseci/reportes
